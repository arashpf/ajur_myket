buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        compileSdkVersion = 34
        targetSdkVersion = 34

        // Force older Google Play Services compatible with RN 0.70
        googlePlayServicesVersion = "21.2.0"

        rngesturehandlerVersion = "2.8.0"

        // Force Kotlin 1.8.0 across all modules (including iab-myket-reactnative,
        // which otherwise pulls kotlin-stdlib:2.0.20 — undeckable by AGP 7.4).
        kotlinVersion = "1.8.0"

        if (System.properties['os.arch'] == "aarch64") {
            // For Apple Silicon (M1/M2) Macs, use NDK 24
            ndkVersion = "24.0.8215888"
        } else {
            // Default NDK version
            ndkVersion = "21.4.7075529"
        }
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2")
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"
        classpath 'com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:1.8.0-1.0.9'
        classpath 'com.google.gms:google-services:4.4.0'
        classpath 'com.google.firebase:firebase-appdistribution-gradle:4.0.0'
        classpath("de.undercouch:gradle-download-task:5.0.1")
    }
}

allprojects {
    repositories {
        google()

        mavenCentral {
            // Exclude old React Native versions living in Central
            content {
                excludeGroup "com.facebook.react"
            }
        }

        // React Native Android sources
        maven {
            url("$rootDir/../node_modules/react-native/android")
        }

        // Android JSC binaries from npm
        maven {
            url("$rootDir/../node_modules/jsc-android/dist")
        }

        // Other common open-source packages
        maven { url 'https://www.jitpack.io' }


    }
}

subprojects {
    configurations.all {
        resolutionStrategy {
            // --- Measurement stack ---
            force "com.google.android.gms:play-services-measurement:21.2.0"
            force "com.google.android.gms:play-services-measurement-impl:21.2.0"
            force "com.google.android.gms:play-services-measurement-api:21.2.0"
            force "com.google.android.gms:play-services-measurement-sdk-api:21.2.0"
            force "com.google.android.gms:play-services-measurement-base:21.2.0"

            // --- Core Play Services coherence ---
            force "com.google.android.gms:play-services-base:18.2.0"
            force "com.google.android.gms:play-services-basement:18.1.0"
            force "com.google.android.gms:play-services-tasks:18.0.2"
            force "com.google.android.gms:play-services-location:21.0.1"

            // --- Kotlin stdlib (needed because iab-myket-reactnative defaults to 2.0.20,
            //     which AGP 7.4's D8 cannot dex) ---
            force "org.jetbrains.kotlin:kotlin-stdlib:1.8.0"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0"
        }
    }
}



