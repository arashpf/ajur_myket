apply plugin: "com.android.application"
apply plugin: "com.google.gms.google-services"
apply plugin: "kotlin-android"

repositories {
    google()
    mavenCentral()
}

// Clean generated resources before each build
task cleanGeneratedResources(type: Delete) {
    delete fileTree(dir: "$projectDir/build/generated/res", include: "**/*")
    delete fileTree(dir: "$projectDir/src/main/res", include: "**/node_modules_*")
    delete fileTree(dir: "$projectDir/src/main/res", include: "**/src_components_*")
    delete fileTree(dir: "$projectDir/src/main/res", include: "**/src_assets_*")
}

preBuild.dependsOn cleanGeneratedResources

preBuild.doFirst {
    println "========================================="
    println "🔄 Starting fresh bundle generation..."
    println "========================================="
    
    def assetsDir = file("$projectDir/src/main/assets")
    if (!assetsDir.exists()) {
        assetsDir.mkdirs()
    }
    
    def bundleFile = file("$projectDir/src/main/assets/index.android.bundle")
    if (bundleFile.exists()) {
        bundleFile.delete()
        println "✅ Deleted old bundle"
    }
    
    try {
        exec {
            workingDir "$rootDir/.."
            commandLine "npx", "react-native", "bundle",
                "--platform", "android",
                "--dev", "false",
                "--entry-file", "index.js",
                "--bundle-output", "${assetsDir}/index.android.bundle"
        }
        println "✅ Fresh bundle generated successfully"
    } catch (Exception e) {
        println "❌ Bundle generation failed: ${e.message}"
        throw e
    }
    println "========================================="
}

project.ext.vectoricons = [
    iconFontNames: ['MaterialIcons.ttf', 'Ionicons.ttf', 'EvilIcons.ttf']
]

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

import com.android.build.OutputFile

project.ext.react = [
    enableHermes      : true,
    devDisabledInDebug: false,
    bundleInDebug     : false,
    bundleInRelease   : true,
    extraPackagerArgs : ["--minify"]
]

apply from: "../../node_modules/react-native/react.gradle"

def enableSeparateBuildPerCPUArchitecture = false
def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'
def enableHermes = project.ext.react.get("enableHermes", false)

def reactNativeArchitectures() {
    def value = project.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

android {
    namespace "com.Ajour"

    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.Ajour"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode 120101
        versionName "12.1.1"

        vectorDrawables.useSupportLibrary = true

        // ─────────────────────────────────────────────────────────
        // Myket IAP placeholders (required by iab-myket-reactnative)
        // ─────────────────────────────────────────────────────────
        manifestPlaceholders = [
            marketApplicationId: "ir.mservices.market",
            marketBindAddress  : "ir.mservices.market.InAppBillingService.BIND",
            marketPermission   : "ir.mservices.market.BILLING"
        ]

        buildConfigField(
                "boolean",
                "IS_NEW_ARCHITECTURE_ENABLED",
                isNewArchitectureEnabled().toString()
        )
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            storeFile file("my-upload-key.keystore")
            storePassword "ddr007"
            keyAlias "my-key-alias"
            keyPassword "ddr007"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            debuggable false
            zipAlignEnabled true
        }
    }

    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk false
            include(*reactNativeArchitectures())
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def versionCodes = ["armeabi-v7a": 1, "x86": 2, "arm64-v8a": 3, "x86_64": 4]
            def abi = output.getFilter(OutputFile.ABI)
            if (abi != null) {
                output.versionCodeOverride =
                        defaultConfig.versionCode * 1000 + versionCodes[abi]
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1") {
        force = true
    }

    def appCenterSdkVersion = "5.0.0"
    implementation "com.microsoft.appcenter:appcenter-analytics:$appCenterSdkVersion"
    implementation "com.microsoft.appcenter:appcenter-crashes:$appCenterSdkVersion"

    implementation "com.facebook.react:react-native:+"

    implementation platform("com.google.firebase:firebase-bom:32.5.0")
    implementation "com.google.firebase:firebase-analytics"

    implementation "androidx.annotation:annotation:1.4.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.0.0"

    implementation "me.pushy:sdk:1.0.96"
    implementation "me.pushy:sdk-react-native:1.0.20"

    debugImplementation("com.facebook.flipper:flipper:${FLIPPER_VERSION}") {
        exclude group: 'com.facebook.fbjni'
    }

    debugImplementation("com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}") {
        exclude group: 'com.facebook.flipper'
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
    }

    debugImplementation("com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}") {
        exclude group: 'com.facebook.flipper'
    }

    if (enableHermes) {
        implementation("com.facebook.react:hermes-engine:+") {
            exclude group: 'com.facebook.fbjni'
        }
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)

def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") &&
            project.newArchEnabled == "true"
}