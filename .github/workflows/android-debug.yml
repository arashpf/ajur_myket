name: Android Debug Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-debug:
    runs-on: ubuntu-latest

    steps:
      # Pull repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node + npm cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # Install JS deps
      - name: Install npm dependencies
        run: npm install --force

      # Fix RN 0.70 Android CLI issue
      - name: Fix React Native Android CLI version
        run: |
          npm uninstall @react-native-community/cli-platform-android -force
          npm install @react-native-community/cli-platform-android@10.1.1 --save-exact --force

      # Java 17 (RN 0.70 requires Java 11+, 17 is correct)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Fix for permission issues
      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # TEMPORARY: Clean Gradle cache to avoid stale mixed Play Services deps
      - name: Clean Gradle cache (TEMPORARY)
        run: rm -rf ~/.gradle/caches

      # Build APK
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # Upload output
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
