name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install npm dependencies
        run: npm install --force

      - name: Fix React Native Android CLI version
        run: |
          npm uninstall @react-native-community/cli-platform-android -force
          npm install @react-native-community/cli-platform-android@10.1.1 --save-exact --force

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Clean Gradle cache
        run: rm -rf ~/.gradle/caches

      - name: Set up signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo $SIGNING_KEYSTORE_BASE64 | base64 -d > android/app/my-upload-key.keystore
          echo "✅ Keystore created"

      - name: Create assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Generate React Native Bundle
        run: |
          echo "📦 Generating fresh bundle..."
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          echo "✅ Bundle generated"
          ls -la android/app/src/main/assets/

      - name: Build Release APK
        working-directory: android
        run: |
          echo "🔨 Building Release APK..."
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all
          echo "✅ Build complete"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
